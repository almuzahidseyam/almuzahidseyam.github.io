<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="refresh" content="0; url=https://muhammad-almuzahid.web.app/" />
  <link rel="canonical" href="https://muhammad-almuzahid.web.app/" />
  <title>Redirecting to Muhammad Al-Muzahid</title>
  <script>
    (() => {
      const destination = new URL('https://muhammad-almuzahid.web.app/');
      const path = window.location.pathname.replace(/^\/+/, '');
      if (path) destination.pathname = `/${path}`;
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.toString());
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://muhammad-almuzahid.web.app/">Muhammad Al-Muzahid Portfolio</a>…</p>
</body>
</html>
